# Main
spring.main.banner-mode = off
spring.main.log-startup-info = false

# Let in flight requests complete 
server.shutdown = graceful

# Database
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.url = jdbc:h2:tcp://127.0.0.1/nio:test
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = sa

# We run always, but script checks if objects exist first
spring.sql.init.mode = always

# SMTP bind address
smtp.bind = 192.168.1.178
#bind = localhost

# SMTP port
smtp.port = 2525

# SMTP server startup timeout
smtp.start.timeout = 10000

# SMTP user
smtp.user = test

# SMTP password
smtp.password = test

# SMTP user email
smtp.email = test@codeferm.com

# How many SMTP processing threads
smtp.threads = 10

# MS Delay checking for messages
wait = 60000

# File mapping
dir.pattern = MMddyyyy
file.pattern = HHmmssSSS
output.path = /home/servadmin/Downloads

# Timestamp format for mail recieved
log.pattern = MM/dd/yyyy HH:mm:ss.SSS

# Subject and body search example match "cam" followed by digits i.e. cam1, cam2, etc.
device.regex = (?<match>cam\\d+)

# ===================================================================
# Smart Camera Ingress Classifier Configuration
# ===================================================================
# Format: token:EVENT_ENUM_NAME (Evaluated case-insensitively)
smtp.classifier.mappings=\
  person:SMTP_PEOPLE,\
  people:SMTP_PEOPLE,\
  vehicle:SMTP_VEHICLE,\
  car:SMTP_VEHICLE,\
  auto:SMTP_VEHICLE,\
  animal:SMTP_ANIMAL,\
  pet:SMTP_ANIMAL,\
  dog:SMTP_ANIMAL,\
  cat:SMTP_ANIMAL,\
  motion:SMTP_MOTION
