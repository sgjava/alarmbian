# Main
spring.main.banner-mode = off
spring.main.log-startup-info = false

# Let in flight requests complete 
server.shutdown = graceful

# Database
spring.datasource.url = jdbc:h2:tcp://192.168.1.99/nio:test
spring.datasource.driverClassName = org.h2.Driver

# Native Spring Boot boot-strapping property import line.
# The 'optional:' prefix prevents app crashes during local mock test suites if the file isn't present.
spring.config.import=optional:file:/etc/alarmbian/client-secrets.properties

# We run always, but script checks if objects exist first
spring.sql.init.mode = always

# Global UI Configuration Defaults
localPath = /home/username/Downloads
playBefore = 5
playAfter = 5
xMax = 1280
yMax = 720
smtp.ui.types=SMTP_%,SMTP_MOTION,SMTP_PEOPLE,SMTP_VEHICLE,SMTP_ANIMAL,Motion

# ==============================================================================
# CONSOLIDATED CAMERA ROSTER
# ==============================================================================
devices.list=cam1,cam2,cam3,cam4,cam5,cam6,cam7,cam8,cam9,cam10,cam11

# --- Storage Mount Array 1 (/data1) ---
cam1.remoteFromPath=/data1
cam1.remoteToPath=/mnt/data1

cam2.remoteFromPath=/data1
cam2.remoteToPath=/mnt/data1

cam3.remoteFromPath=/data1
cam3.remoteToPath=/mnt/data1

cam4.remoteFromPath=/data1
cam4.remoteToPath=/mnt/data1

cam5.remoteFromPath=/data1
cam5.remoteToPath=/mnt/data1

# --- Storage Mount Array 2 (/data2) ---
cam6.remoteFromPath=/data2
cam6.remoteToPath=/mnt/data2

cam7.remoteFromPath=/data2
cam7.remoteToPath=/mnt/data2

cam8.remoteFromPath=/data2
cam8.remoteToPath=/mnt/data2

cam9.remoteFromPath=/data2
cam9.remoteToPath=/mnt/data2

cam10.remoteFromPath=/data2
cam10.remoteToPath=/mnt/data2

cam11.remoteFromPath=/data2
cam11.remoteToPath=/mnt/data2

# ============================================================================
# Alarmbian PlayUI Native Media Rendering Configurations
# ============================================================================
# Kept as a space-delimited template string layout to ensure pristine process execution
ffplay.command.template=ffplay -vcodec hevc_cuvid -ss %SEEK% -t %DURATION% -af volume=%VOLUME%,alimiter=level_in=1:level_out=0.95:limit=0.99:attack=5:release=50:asc=1 -autoexit -i %FILE%

# Externalized ffmpeg subsegment extraction template
ffmpeg.command.template=ffmpeg -ss %SEEK% -i %FILE% -t %DURATION% -c copy %EXPORT%