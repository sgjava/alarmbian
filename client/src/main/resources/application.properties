# Main
spring.main.banner-mode = off
spring.main.log-startup-info = false

# Let in flight requests complete 
server.shutdown = graceful

# Database
spring.datasource.url = jdbc:h2:tcp://localhost/nio:test
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = sa
# We run always, but script checks if objects exist first
spring.sql.init.mode = always

# Device
device.name = cam1

# FFMPEG

# Class used to record stream
ffmpeg.className = com.codeferm.alarmbian.FfmpegOut
# Binary path for ffmpeg (include trailing slash)
ffmpeg.bin = /usr/bin/local/
# Local path for recordings
ffmpeg.localPath = /data1
# Remote from path for recordings to replace substring in localPath
ffmpeg.remoteFromPath = /data1
# Remote to path for recordings to replace substring in localPath
ffmpeg.remoteToPath = /data1
# Video container
ffmpeg.container = mkv
# Directory name pattern based on DateTimeFormatter
ffmpeg.dirPattern = MMddyyyy
# File name pattern based on DateTimeFormatter
ffmpeg.filePattern = HHmmss