[program:smtp]
command = java -Djava.rmi.server.hostname=192.168.1.99 -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=8883 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -XX:+HeapDumpOnOutOfMemoryError -Xmx128m -Djava.library.path=/home/username/opencv/build/lib -jar smtp-1.0.0-SNAPSHOT.jar --spring.config.location=smtp.properties
priority=500
directory = /home/username
user = username
startsecs = 0
autostart = true  
autorestart = true  
stdout_logfile = /home/username/logs/smtp.log  
stderr_logfile = /home/username/logs/smtp_err.log
